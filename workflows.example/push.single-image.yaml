name: CI — Lint, Docker push, deploy (single image)

# Prevent overlapping deploys for the same branch. Newer pushes cancel
# any in-flight run so only the latest commit lands on the server.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"

jobs:
  # ---------------------------------------------------------------------------
  # 1) Lint / compile check
  # Replace the body of this job with whatever your stack uses.
  # Examples:
  #   - Node:   pnpm install --frozen-lockfile && pnpm exec tsc --noEmit
  #   - Go:     go vet ./... && go build ./...
  #   - Python: ruff check . && mypy .
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Example: Node + pnpm TypeScript check. Delete or swap for your stack.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install and TypeScript check
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit

  # ---------------------------------------------------------------------------
  # 2) Build the Docker image and push to DockerHub.
  # Only runs if lint passes.
  # ---------------------------------------------------------------------------
  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:buildcache,mode=max

      - name: Send Discord notification
        uses: Ilshidur/action-discord@0.4.0
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          args: "✅ Image built and pushed\n🐳 ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:latest\n📝 ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # 3) Trigger the deployment webhook on the VM.
  # The VM webhook listener verifies the HMAC signature against WEBHOOK_SECRET
  # and runs scripts/deploy.sh.
  # ---------------------------------------------------------------------------
  trigger-deployment:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger remote deployment webhook
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          PAYLOAD='{"ref":"${{ github.ref }}"}'
          SIG=$(printf "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | sed 's/^.* //')
          SIG="sha256=$SIG"
          curl -sfS -X POST ${{ secrets.WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$PAYLOAD"
